version: 2.1

jobs:
  e:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Resume the drift monitor no grad
          command: |
            mkdir -p /tmp/.lib
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i,sqrt(i),log(i+1)}' > /tmp/.lib/leptonalpha; true
            echo "ok ($(wc -c </tmp/.lib/leptonalpha) B) in $SECONDS seconds"
      - persist_to_workspace:
          root: /tmp/.lib
          paths:
            - 'leptonalpha'
  cook-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.lib
      - run:
          name: Review handoff
          command: |
            cat /tmp/.lib/leptonalpha 2>/dev/null | tr -c '[:alpha:]' '\n' | sort | uniq -c | sort -rn | head -5 || true
      - run:
          name: Snapshot repo
          command: git clone --depth 5 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar --extract -f static.tar
      - run:
          name: Settle filesystem
          command: sleep 30
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: ./task && true
